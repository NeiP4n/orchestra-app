name: "orchestra GitHub Action"
description: "Run orchestra in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/orchestra'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get orchestra version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/NeiP4n/orchestra-app/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache orchestra
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.orchestra/bin
        key: orchestra-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install orchestra
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p "$HOME/.orchestra/bin"
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64) ASSET="orchestra-linux-x64" ;;
          macOS-ARM64) ASSET="orchestra-darwin-arm64" ;;
          Windows-X64) ASSET="orchestra-windows-x64.exe" ;;
          *) echo "Unsupported runner: ${{ runner.os }}-${{ runner.arch }}" >&2; exit 1 ;;
        esac
        curl -fsSL -o "$HOME/.orchestra/bin/orchestra" "https://github.com/NeiP4n/orchestra-app/releases/download/${{ steps.version.outputs.version }}/${ASSET}"
        chmod +x "$HOME/.orchestra/bin/orchestra"

    - name: Add orchestra to PATH
      shell: bash
      run: echo "$HOME/.orchestra/bin" >> $GITHUB_PATH

    - name: Install action dependencies
      shell: bash
      run: bun install --cwd "${{ github.action_path }}"

    - name: Run orchestra
      shell: bash
      id: run_orchestra
      run: bun "${{ github.action_path }}/index.ts"
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        PROMPT: ${{ inputs.prompt }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        GITHUB_TOKEN: ${{ github.token }}
