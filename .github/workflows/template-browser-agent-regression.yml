name: template-browser-agent-regression
on:
  pull_request:
    paths:
      - 'packages/server/src/handlers/orchestra.ts'
      - 'packages/core/src/project-template*.ts'
      - 'packages/server/test/template-browser-agent.test.ts'
      - '.github/workflows/template-browser-agent-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    name: BrowserAgent template HTTP roundtrip (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Configure fixture identity
        run: |
          git config --global user.email "orchestra-bot@users.noreply.github.com"
          git config --global user.name "orchestra-bot"
      - name: Actual HTTP save, prepare, confirm and finish with an explicit BrowserAgent
        run: bun test packages/server/test/template-browser-agent.test.ts
      - name: Preserve unavailable role and browser ownership refusals
        run: bun test packages/core/test/project-template-import.test.ts packages/core/test/project-template-v2-plan.test.ts packages/core/test/project-template-browser-binding-review.test.ts packages/core/test/project-template-destination-diagnostics.test.ts packages/server/test/template-operation.test.ts
