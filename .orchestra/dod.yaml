      nemotron-3-ultra-free nemotron-3.5-lightning-free longcat-2.5-preview-free
      ling-3.0-flash-fin-free; do printf '%-34s ' "$m";
      timeout 120 opencode run -m opencode/$m "ок" < /dev/null 2>&1 | tail -1; done
    oracle_scope:
      detects:
        - "сборка объявляет версию < 1.18.0: провайдер opencode.ai отвечает 403 «OpenCode 1.18.0 or newer is required to use the free tier»"
        - "любая из 10 бесплатных моделей перестала отвечать после замены бинаря (регрессия)"
