coverage:
  complete: false
  reason: >-
    Исполняемая поверхность не извлечена формальным парсером: символы TypeScript и Effect
    Schema в этом проекте не имеют готового extractor'а, который дал бы перечень всех
    экспортов пакетов. Слои зависимостей прочитаны из packages/*/package.json, подсистемы
    ядра — из чтения кода. Поэтому сопоставление «символ → документ» не построено, и полнота
    покрытия не заявляется. Проверка O-DOC-REALITY ловит выдуманные символы точечно,
    но не доказывает, что описано всё.
  surface:
    extractor: "./.opencode/doc_check.py --surface"
    fingerprint: "527f0b931d-v2.0.22"
    generated_at: "2026-10-06"
    note: >-
      Поверхность = список пакетов из packages/* плюс список пакетов из
      .opencode/doc_manifest.txt. Расхождение этих двух списков — дефект.
  items:
    - id: COV-1
      what: "35 пакетов из packages/*, каждый получает свой PACKAGE.md"
      status: IN_SCOPE
    - id: COV-2
      what: "8 каталогов packages/core/src/{session,tool,config,database,filesystem,instructions,permission,plugin} — по PACKAGE.md в каждом"
      status: IN_SCOPE
      note: >-
        Снимок дерева 06.10: provider, snapshot и instruction в core/src — одиночные .ts рядом
        с одноимёнными каталогами ради sql.ts, отдельного каталога provider/ или snapshot/
        нет. Поэтому в манифест подпапок попали 8 реальных каталогов, а не 11 имён из
        первоначальной формулировки; provider и snapshot описаны в packages/core/PACKAGE.md.
    - id: COV-3
      what: "6 каталогов packages/tui/src/{component,routes,context,mini,feature-plugins,plugin} — по PACKAGE.md в каждом"
      status: IN_SCOPE
    - id: COV-4
      what: "ARCHITECTURE.md в корне: карта слоёв и указатель пакетов"
      status: IN_SCOPE
    - id: COV-5
      what: "node_modules/** и артефакты сборки (dist, ts-dist, artifacts)"
      status: OUT_OF_SCOPE
      reason: "не исходники ядра, документация не имеет смысла"
    - id: COV-6
      what: "packages/core/test/** (96.5 тыс. строк тестов из 162.7 тыс. в core)"
      status: OUT_OF_SCOPE
      reason: "тесты не разбираются построчно, в core/PACKAGE.md упоминаются обзорно"
    - id: COV-7
      what: "console/** и stats/**"
      status: OUT_OF_SCOPE
      reason: "инфраструктура Astro/SST для хостинга, а не ядро CLI — только карточка по решению DEC-4"

stages:
  - name: "Этап 1 — каркас документации и карта ядра"
    goal: >-
      Валидатор документации, манифест пакетов и ARCHITECTURE.md: дальше на каркасе
      пишутся все PACKAGE.md, и без работающего валидатора нельзя доказать, что
      документация полная.
    done_when: "python3 .opencode/doc_check.py → код 0; bash .opencode/doc_check.sh → код 0 (отрицательный контроль ловит 4 дефекта)"
    depends_on: []
  - name: "Этап 2 — фундамент: типы и транспорт типов"
    goal: >-
      schema, util, protocol, client — четыре пакета, на которых стоит всё остальное:
      из них типы и контракты берут верхние слои.
    done_when: "python3 .opencode/doc_check.py → код 0, в манифесте 4 пакета с PACKAGE.md и все подпапочные документы этапа"
    depends_on: ["Этап 1 — каркас документации и карта ядра"]
  - name: "Этап 3 — ядро выполнения"
    goal: >-
      core с его подсистемами (session, tool, config, database, provider, permission),
      плюс codemode и plugin: здесь живёт сама работа ИИ — сессии, инструменты, провайдеры.
    done_when: "python3 .opencode/doc_check.py → код 0, у packages/core и его подпапок есть документы"
    depends_on: ["Этап 2 — фундамент: типы и транспорт типов"]
  - name: "Этап 4 — транспорт и модели"
    goal: >-
      server (HTTP/SSE, авторизация, порты), ai (провайдеры и протоколы), sdk,
      session-ui: связь ядра с внешним миром и с клиентами.
    done_when: "python3 .opencode/doc_check.py → код 0, документы server/ai/sdk/session-ui на месте"
    depends_on: ["Этап 3 — ядро выполнения"]
  - name: "Этап 5 — поверхности и периферия"
    goal: >-
      tui, cli, app, ui и остальные пакеты: то, что видит человек, плюс Electron/web
      и служебные пакеты — чтобы карта ядра была полной.
    done_when: "python3 .opencode/doc_check.py → код 0, все пакеты манифеста закрыты"
    depends_on: ["Этап 4 — транспорт и модели"]
  - name: "Этап 6 — приёмка"
    goal: >-
      Отрицательный контроль валидатора выполнен на настоящей мутации, dod-check зелёный,
      владелец получил отчёт с числами.
    done_when: "bash .opencode/doc_check.sh → код 0; ~/.config/opencode/bin/dod-check . → ИТОГ: OK"
    depends_on: ["Этап 5 — поверхности и периферия"]
  - name: "Этап 7 — версия сборки и доступ к free-tier моделям"
    goal: >-
      Собрать локальное ядро OpenCode с настоящей версией (2.0.22, тег исходников)
      вместо 0.0.0-local-даты, чтобы User-Agent, который уходит провайдеру
      opencode.ai, содержал число ≥ 1.18.0. Из-за этого сейчас 8 из 10 бесплатных
      моделей отвечают 403. Этап даёт остальным задачам рабочий инструмент: без
      него любой прогон на muse-spark, exo, ling, mimo, nemotron, longcat обрывается.
    done_when: >-
      `opencode --version` печатает 2.0.22 и цикл O-FREE даёт 10 из 10 ответов без
      строки «1.18.0 or newer»
    depends_on: []
  - name: "Этап 8 — Registry-панель Universal Tool Hub в devtools-bar"
    goal: >-
      Панель Registry в нижней devtools-строке TUI показывает человеку, какие инструменты
      и терминалы каталога Hub установлены, какие нет, и какова готовность записей каталога —
