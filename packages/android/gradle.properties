# The Kotlin DSL plus AGP needs more heap than the 512 MB default; R8 and D8
# both run inside this daemon.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

# compileSdk 36 only supports AndroidX; non-transitive R classes keep the app
# module's build from depending on resources it does not declare.
android.useAndroidX=true
android.nonTransitiveRClass=true