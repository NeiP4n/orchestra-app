<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orchestra Quick Action</title>
  <link rel="stylesheet" href="sidebar.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header-bar">
      <span class="brand-title">Orchestra Quick</span>
      <div id="statusBadge" class="status-badge offline">
        <span class="status-dot"></span>
        <span id="statusText">Checking...</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Current Tab</div>
      <div class="tab-info-title" id="tabTitle">Loading...</div>
      <div class="tab-info-url" id="tabUrl">—</div>
    </div>

    <button id="quickSendBtn" class="btn btn-primary">
      Send Page to Orchestra
    </button>

    <div id="quickFeedback" class="alert-box alert-success hidden">
      Sent!
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
