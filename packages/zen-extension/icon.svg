<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="sculkNeon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#5df9de" />
    </linearGradient>
    <radialGradient id="sculkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#00e5ff" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Dark Background -->
  <rect width="128" height="128" rx="26" fill="#02080b" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="24.5" fill="none" stroke="#0e4c54" stroke-width="2" />

  <!-- Bioluminescent Core Glow -->
  <circle cx="64" cy="66" r="46" fill="url(#sculkGlow)" />

  <!-- Sculk Sensor Tendrils & Acoustic Resonator -->
  <g filter="url(#neonGlow)">
    <!-- Left Tendril Antenna -->
    <path d="M 38 78 C 34 60 30 46 26 38 C 24 35 27 32 30 34 C 36 38 42 50 48 64" 
          fill="none" stroke="url(#sculkNeon)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="26" cy="37" r="3.2" fill="#5df9de" />

    <!-- Right Tendril Antenna -->
    <path d="M 90 78 C 94 60 98 46 102 38 C 104 35 101 32 98 34 C 92 38 86 50 80 64" 
          fill="none" stroke="url(#sculkNeon)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="102" cy="37" r="3.2" fill="#5df9de" />

    <!-- Central Acoustic Resonator (Sculk Core / Orchestra Ring) -->
    <circle cx="64" cy="70" r="22" fill="#05151c" stroke="url(#sculkNeon)" stroke-width="3" />
    <circle cx="64" cy="70" r="13" fill="#0a262e" stroke="#00e5ff" stroke-width="2" />
    <circle cx="64" cy="70" r="5" fill="#5df9de" />

    <!-- Resonance Wave Arcs (Sound Vibrations) -->
    <path d="M 50 46 C 58 40 70 40 78 46" fill="none" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M 54 36 C 60 32 68 32 74 36" fill="none" stroke="#5df9de" stroke-width="2" stroke-linecap="round" opacity="0.65" />

    <!-- Catalyst Soul Particles -->
    <circle cx="48" cy="98" r="2" fill="#00e5ff" opacity="0.75" />
    <circle cx="80" cy="98" r="2" fill="#5df9de" opacity="0.75" />
    <circle cx="64" cy="103" r="2.5" fill="#00e5ff" opacity="0.9" />
  </g>
</svg>
